# Push-to-deploy for Expo Hosting: restores `.env` from the DOT_ENV secret,
# then runs the `eas:deploy` script — the web export executes on this runner
# (GitHub Actions is free for public repositories), and `eas-cli` (via `bun x`)
# uploads only the finished build/ artifact to EAS for production Hosting.
# Nothing is pushed back to the repository, and EAS runs no builds.
# Required repository secret (see README.md → Deployment): DOT_ENV

name: Expo Hosting deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore .env from the DOT_ENV secret
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: printf '%s' "$DOT_ENV" > .env

      - name: Set up Bun (1.4.5, matching the Docker image)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export the web build and deploy it to Expo Hosting
        run: bun run eas:deploy
