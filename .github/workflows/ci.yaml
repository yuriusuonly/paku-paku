# CI for the Bun and Playwright suites: restores `.env` from the DOT_ENV
# secret and runs both test commands on pushes, pull requests and manual
# dispatch. Playwright starts the Expo dev server and Caddy from
# playwright.config.js, so Caddy is installed on the runner and browsers are
# installed before that step. Coverage is enforced at 95% overall.
# Required repository secret (see README.md → Deployment): DOT_ENV

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore .env from the DOT_ENV secret
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: printf '%s' "$DOT_ENV" > .env

      - name: Set up Bun (1.4.5, matching the Docker image)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun tests with a coverage gate
        run: bun ./scripts/bun.js test --coverage --coverage-threshold=95

      - name: Install Caddy for the HTTPS proxy
        run: |
          go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json', 'bun.lock') }}

      - name: Install Playwright browsers
        run: bun run playwright -- install --with-deps chromium

      - name: Run Playwright E2E tests
        run: bun run playwright:test
