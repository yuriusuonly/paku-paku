# Push-to-deploy for hosted Supabase: restores `.env` from the DOT_ENV secret
# and runs the `supabase:link` + `supabase:push` scripts so migrations and
# configured seed data are applied to the hosted (production) project.
# Required repository secret (see README.md → Deployment): DOT_ENV

name: Supabase deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore .env from the DOT_ENV secret
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: printf '%s' "$DOT_ENV" > .env

      - name: Set up Bun (1.4.5, matching the Docker image)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Link the hosted project
        run: bun run supabase:link

      - name: Push migrations and seed to hosted Supabase
        run: bun run supabase:push
