services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    working_dir: /app
    volumes:
      - ./:/app
      - playwright_node_modules:/app/node_modules
    environment:
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-http://host.docker.internal:${URL_PORT:-3000}}
      CI: ${CI:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ipc: host
    init: true
    command: ["bash", "-lc", "npm ci && npx playwright test"]

volumes:
  playwright_node_modules:
