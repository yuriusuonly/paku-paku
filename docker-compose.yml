# All-in-one Docker Compose for local run, build, and tests.
# Requires `.env` (see `bun run docker:*` / `test` scripts).

x-app-build: &app-build
  context: .
  args:
    URL_PORT: ${URL_PORT}
    URL_PROXY_PORT: ${URL_PROXY_PORT}
    # Client-side Supabase config inlined by `expo export` (build context has no .env)
    EXPO_PUBLIC_SUPABASE_TARGET: ${EXPO_PUBLIC_SUPABASE_TARGET:-local}
    EXPO_PUBLIC_SUPABASE_LOCAL_URL: ${EXPO_PUBLIC_SUPABASE_LOCAL_URL}
    EXPO_PUBLIC_SUPABASE_LOCAL_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_LOCAL_ANON_KEY}
    EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL}
    EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY}

services:
  server:
    profiles: ["app"]
    build: *app-build
    image: paku-paku-app:local
    # Server-side Supabase config is read at runtime, not inlined. Docker
    # reaches the local stack through Kong on the Supabase project network
    # instead of the host's loopback address (127.0.0.1 is not routable here).
    environment:
      RUNNING_IN_DOCKER: "1"
      EXPO_PUBLIC_SUPABASE_TARGET: ${EXPO_PUBLIC_SUPABASE_TARGET:-local}
      EXPO_PUBLIC_SUPABASE_LOCAL_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_LOCAL_ANON_KEY}
      EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_LOCAL_SERVER_URL: ${SUPABASE_LOCAL_SERVER_URL:-http://api.supabase.internal:8000}
    networks:
      - default
      - supabase
    # The launcher reads URL_PORT from the container env and appends `--port`
    # (expo serve ignores the env var itself), so no shell interpolation is
    # needed in this argv.
    command: ["bun", "./scripts/expo.js", "serve", "build"]
    healthcheck:
      # wget busybox binary present in the bun alpine image; port comes from env
      test: ["CMD", "wget", "-qO-", "http://localhost:${URL_PORT}/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  caddy:
    profiles: ["app"]
    build: *app-build
    image: paku-paku-app:local
    # HTTPS edge; `BACKEND_HOST` points the Caddyfile's
    # `{$BACKEND_HOST:-localhost}` placeholder at the `server` service alias.
    command: ["caddy", "run", "--config", "/app/Caddyfile"]
    environment:
      BACKEND_HOST: server
    ports:
      - "${URL_PROXY_PORT}:${URL_PROXY_PORT}"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: build static web export into ./build on the host.
  build:
    profiles: ["build"]
    image: oven/bun:1.4.5-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - build_node_modules:/app/node_modules
    environment:
      EXPO_PUBLIC_SUPABASE_TARGET: ${EXPO_PUBLIC_SUPABASE_TARGET:-local}
      EXPO_PUBLIC_SUPABASE_LOCAL_URL: ${EXPO_PUBLIC_SUPABASE_LOCAL_URL}
      EXPO_PUBLIC_SUPABASE_LOCAL_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_LOCAL_ANON_KEY}
      EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY}
    command: ["sh", "-lc", "bun install --frozen-lockfile && bun run expo:build"]

  # One-shot: unit and integration/mock tests (Bun).
  test-unit:
    profiles: ["test"]
    image: oven/bun:1.4.5-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - test_node_modules:/app/node_modules
    command: ["sh", "-lc", "bun install --frozen-lockfile && bun test"]

networks:
  # Created by `bun run supabase:start` as `supabase_network_<project_id>`.
  # Start the local Supabase stack before running the `app` profile.
  supabase:
    external: true
    name: ${SUPABASE_DOCKER_NETWORK:-supabase_network_paku-paku}

volumes:
  build_node_modules:
  test_node_modules:
