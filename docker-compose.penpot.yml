# Dedicated Compose file for the locally hosted Penpot MCP server.
# Run with `bun run penpot:local`; configuration comes from .env via the
# scripts/docker.js launcher.

services:
  penpot:
    image: penpotapp/mcp:latest
    environment:
      PENPOT_MCP_SERVER_HOST: 0.0.0.0
      PENPOT_MCP_SERVER_PORT: "4401"
      PENPOT_MCP_WEBSOCKET_PORT: "4402"
      PENPOT_MCP_PLUGIN_SERVER_HOST: 0.0.0.0
      PENPOT_MCP_REMOTE_MODE: ${PENPOT_MCP_REMOTE_MODE:-true}
      PENPOT_MCP_BACKEND_URI: ${PENPOT_MCP_BACKEND_URI:-https://design.penpot.app}
    ports:
      - "4400:4400"
      - "4401:4401"
      - "4402:4402"
    restart: unless-stopped
